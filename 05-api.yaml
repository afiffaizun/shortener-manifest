apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener-api
  namespace: shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shortener-api
  template:
    metadata:
      labels:
        app: shortener-api
    spec:
      serviceAccountName: shortener-sa
      containers:
      - name: api
        # PLACEHOLDER: nginx hanya untuk bukti infra jalan.
        # Saat image shortener asli siap (listen PORT=3000 dari ConfigMap),
        # ganti image di bawah lalu ubah containerPort + kedua probe ke 3000,
        # dan Service targetPort ke 3000.
        image: nginx:alpine
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: shortener-config
        - secretRef:
            name: shortener-secret
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: shortener-svc
  namespace: shortener
spec:
  selector:
    app: shortener-api
  ports:
  - port: 80
    targetPort: 80

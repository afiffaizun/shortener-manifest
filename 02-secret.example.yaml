# Template — aman di-commit. Cara pakai:
#   cp 02-secret.example.yaml 02-secret.yaml
# lalu ganti REPLACE_ME dengan kredensial asli. File 02-secret.yaml
# diabaikan git (lihat .gitignore) dan hanya dipakai untuk kubectl apply lokal.
apiVersion: v1
kind: Secret
metadata:
  name: shortener-secret
  namespace: shortener
type: Opaque
stringData:
  DB_USER: "shortener_user"
  DB_PASSWORD: "REPLACE_ME"

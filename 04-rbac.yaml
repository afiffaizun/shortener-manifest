apiVersion: v1
kind: ServiceAccount
metadata:
  name: shortener-sa
  namespace: shortener
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shortener-role
  namespace: shortener
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shortener-rolebinding
  namespace: shortener
subjects:
- kind: ServiceAccount
  name: shortener-sa
  namespace: shortener
roleRef:
  kind: Role
  name: shortener-role
  apiGroup: rbac.authorization.k8s.io
